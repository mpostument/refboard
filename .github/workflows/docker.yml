name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    # The docs-sync workflow's own commits touch only docs/ - excluding it
    # here stops a Pages-only sync from triggering an unrelated image rebuild.
    paths-ignore:
      - 'docs/**'
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Versioned tags only, no "type=sha": a build off main with no version
      # tag yet gets "latest" and nothing else, and a `git tag v1.2.3 && git
      # push --tags` is what actually produces 1.2.3 / 1.2 / 1 - see README
      # for the release steps.
      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # The Dockerfile's VERSION build-arg, stamped into the assembly so
      # /healthz (and the page footer that reads it) report the version
      # actually running - "0.0.0-dev" for anything that isn't a real vX.Y.Z
      # tag push, matching the csproj's own local-build default.
      - name: Compute version
        id: ver
        run: |
          if [[ "${{ github.ref_type }}" == "tag" && "${{ github.ref_name }}" == v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # PRs build (both arches, to catch a target-arch-only failure) but never
      # push - forking this repo should never be able to publish to your GHCR.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.ver.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
